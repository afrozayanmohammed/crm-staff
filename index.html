<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Finaqular — Staff CRM Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{
  --bg-1:#030618;
  --bg-2:#07122a;
  --glass: rgba(255,255,255,0.03);
  --muted:#9fb4d0;
  --accent:#00f0ff;
  --accent-2:#00aaff;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}
*{box-sizing:border-box}
body{margin:0; color:#eaf6ff; background: radial-gradient(circle at 10% 10%, rgba(0,240,255,0.04), transparent), linear-gradient(180deg,var(--bg-1),var(--bg-2)); -webkit-font-smoothing:antialiased;}
.wrap{max-width:1200px;margin:28px auto;padding:18px}
header{display:flex;align-items:center;gap:12px}
.brand{font-weight:900;font-size:20px;letter-spacing:1px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
button{border:0;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#022426}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(2,6,23,0.6)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th, td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.03)}
th{font-size:12px;color:var(--muted);text-transform:uppercase}
.status-pill{padding:6px 9px;border-radius:999px;font-weight:700;font-size:12px}
.s-new{background:rgba(0,240,255,0.06);color:var(--accent)}
.s-contacted{background:rgba(255,255,255,0.03);color:#ffd166}
.s-qualified{background:rgba(255,255,255,0.03);color:#b794f4}
.s-proposal{background:rgba(255,255,255,0.03);color:#9ae6b4}
.s-won{background:rgba(0,240,255,0.06);color:#10b981}
.s-lost{background:rgba(255,255,255,0.03);color:#ef4444}
.action-btn{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.04);cursor:pointer;color:#d3e2ff}
.action-btn:hover{background:rgba(255,255,255,0.08)}
.small{font-size:13px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,0.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}
.modal{width:100%;max-width:720px;background:linear-gradient(180deg,#071022,#04101a);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.02)}
.modal input, .modal textarea, .modal select {width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;margin-top:8px}
@media(max-width:900px){ .wrap{padding:12px} table{font-size:13px} }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">FINAQULAR</div>
        <div class="sub">Staff CRM Dashboard — Real-time pipeline & lead management</div>
      </div>

      <div class="top-actions">
        <div id="auth-section" class="card" style="padding:8px 10px;display:flex;gap:10px;align-items:center">
          <div class="small muted" id="user-label">Not signed in</div>
        </div>
        <button id="btn-signin" class="btn-primary">Login</button>
        <button id="btn-signout" class="btn-ghost" style="display:none">Sign out</button>
      </div>
    </header>

    <div style="margin-top:18px" class="card">
      <h3 style="margin:0 0 12px">Lead List</h3>
      <div class="table-wrap">
        <table aria-live="polite">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="6" style="text-align:center;color:var(--muted)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal card">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h3 id="modal-title">Edit Lead</h3>
        <button id="modal-close" class="btn-ghost">Close</button>
      </div>

      <div style="margin-top:12px">
        <label class="small">Name</label>
        <input id="m-name" />

        <label class="small">Email</label>
        <input id="m-email" />

        <label class="small">Phone</label>
        <input id="m-phone" />

        <label class="small">Status</label>
        <select id="m-status">
          <option>New</option><option>Contacted</option><option>Qualified</option><option>Proposal</option><option>Won</option><option>Lost</option>
        </select>

        <label class="small">Owner</label>
        <input id="m-owner" placeholder="owner email (optional)" />

        <label class="small">Comment (customer)</label>
        <textarea id="m-comment"></textarea>

        <div style="display:flex;gap:8px;margin-top:12px">
          <button id="modal-save" class="btn-primary">Save</button>
          <button id="modal-delete" class="btn-ghost" style="background:#2b2b2b;color:#fff">Delete</button>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  // -------------------------
  // Firebase config (you provided)
  // -------------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot,
    doc, getDoc, updateDoc, deleteDoc, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPqbxxoNUos9Zqe-En4qQghHPLjCUN3vA",
    authDomain: "finaqular-crm.firebaseapp.com",
    projectId: "finaqular-crm",
    storageBucket: "finaqular-crm.firebasestorage.app",
    messagingSenderId: "708297871714",
    appId: "1:708297871714:web:bff1ff1976f33bb1b55c3b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // UI refs
  const tbody = document.getElementById('table-body');
  const modalBackdrop = document.getElementById('modal');
  const modalClose = document.getElementById('modal-close');
  const modalSave = document.getElementById('modal-save');
  const modalDelete = document.getElementById('modal-delete');

  const mName = document.getElementById('m-name');
  const mEmail = document.getElementById('m-email');
  const mPhone = document.getElementById('m-phone');
  const mStatus = document.getElementById('m-status');
  const mOwner = document.getElementById('m-owner');
  const mComment = document.getElementById('m-comment');

  let currentLeadId = null;

  // Real-time listener for leads collection (ordered by createdAt desc)
  const q = query(collection(db, 'leads'), orderBy('createdAt','desc'));
  onSnapshot(q, snapshot => {
    // build rows
    const rows = [];
    snapshot.forEach(docSnap => {
      const d = docSnap.data();
      const id = docSnap.id;
      rows.push({ id, ...d });
    });
    renderRows(rows);
  }, err=>{
    console.error('Realtime error', err);
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#ff9b9b">Realtime error: ${err.message}</td></tr>`;
  });

  function renderRows(leads){
    if(!leads || leads.length === 0){
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted)">No leads yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = leads.map(l => {
      const email = escapeHtml(l.email || '-');
      const phone = escapeHtml(l.phone || '-');
      const status = escapeHtml(l.status || 'New');
      const owner = escapeHtml(l.owner || '-');
      return `<tr data-id="${l.id}">
        <td style="font-weight:700">${escapeHtml(l.name||'-')}</td>
        <td class="small">${email}</td>
        <td class="small">${phone}</td>
        <td><span class="status-pill s-${(status||'new').toLowerCase()}">${status}</span></td>
        <td class="small">${owner}</td>
        <td><button class="action-btn" data-id="${l.id}" data-action="edit">Edit</button></td>
      </tr>`;
    }).join('');

    // attach click listeners for edit buttons
    document.querySelectorAll('button[data-action="edit"]').forEach(btn=>{
      btn.addEventListener('click', (e)=> {
        const id = btn.dataset.id;
        openModal(id);
      });
    });
  }

  // open modal and populate data
  async function openModal(id){
    currentLeadId = id;
    modalBackdrop.style.display = 'flex';
    const snap = await getDoc(doc(db, 'leads', id));
    if(!snap.exists()){
      alert('Lead not found');
      modalBackdrop.style.display = 'none';
      return;
    }
    const d = snap.data();
    mName.value = d.name || '';
    mEmail.value = d.email || '';
    mPhone.value = d.phone || '';
    mStatus.value = d.status || 'New';
    mOwner.value = d.owner || '';
    mComment.value = d.comment || d.notes || '';
  }

  modalClose.addEventListener('click', ()=> { modalBackdrop.style.display = 'none'; currentLeadId = null; });

  // save updates back to firestore
  modalSave.addEventListener('click', async () => {
    if(!currentLeadId) return;
    try{
      await updateDoc(doc(db,'leads',currentLeadId), {
        name: mName.value.trim(),
        email: mEmail.value.trim(),
        phone: mPhone.value.trim(),
        status: mStatus.value,
        owner: mOwner.value.trim(),
        comment: mComment.value.trim(),
        updatedAt: serverTimestamp()
      });
      modalBackdrop.style.display = 'none';
      currentLeadId = null;
    }catch(e){
      console.error(e);
      alert('Save failed: '+e.message);
    }
  });

  // delete lead
  modalDelete.addEventListener('click', async () => {
    if(!currentLeadId) return;
    if(!confirm('Delete this lead?')) return;
    try{
      await deleteDoc(doc(db,'leads',currentLeadId));
      modalBackdrop.style.display = 'none';
      currentLeadId = null;
    }catch(e){
      alert('Delete failed: '+e.message);
    }
  });

  // small utility
  function escapeHtml(s){ if(!s) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

  // optional: seed if empty (comment out if you don't want it)
  // (not necessary since you already have public leads)
</script>
</body>
</html>
