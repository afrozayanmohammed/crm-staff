<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Finaqular — Staff CRM Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
/* ---------------------------------------------------------
   Gen-Z Fintech UI
--------------------------------------------------------- */
:root {
  --bg1:#041026; 
  --bg2:#071428; 
  --glass:rgba(255,255,255,0.03);
  --muted:#9fb4d0;
  --accent:#00f0ff; 
  --accent2:#00aaff;
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}
* { box-sizing:border-box; }

body{
  margin:0; color:#eaf6ff;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  -webkit-font-smoothing:antialiased;
}

.center{max-width:1100px;margin:28px auto;padding:18px;}

.logo{
  font-weight:900;
  font-size:26px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.muted{color:var(--muted)}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
  padding:20px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.04);
}

/* Login Box */
#login-screen{
  max-width:420px;margin:70px auto;padding:24px;
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:12px;
}
input, textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.04);
  background:transparent;
  color:inherit;
}

button{
  padding:10px 14px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  font-weight:700;
}
.btn-primary{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#032828;
}
.btn-ghost{
  background:transparent;
  border:1px solid rgba(255,255,255,0.04);
  color:var(--muted);
}

/* Dashboard */
#dashboard{display:none;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}
th,td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  text-align:left;
}
th{
  text-transform:uppercase;
  color:var(--muted);
  font-size:12px;
}

.action-btn{
  padding:6px 10px;border-radius:8px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.04);
  color:#d8eefc;
  cursor:pointer;
}
.action-btn:hover{
  background:rgba(255,255,255,0.06);
}

/* Modal */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal{
  width:100%;
  max-width:720px;
  background:#071323;
  padding:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.04);
}

</style>
</head>

<body>

<div class="center">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <div class="logo">FINAQULAR</div>
      <div class="muted" style="margin-top:6px">Staff CRM Dashboard</div>
    </div>
    <button id="logout-btn" class="btn-ghost" style="display:none">Logout</button>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h2 style="margin:0 0 10px">Staff Login</h2>

    <label class="muted">Username</label>
    <input id="login-email" type="email" placeholder="admin@finaqular.com">

    <label class="muted">Password</label>
    <input id="login-pass" type="password" placeholder="admin@123">

    <button id="login-btn" class="btn-primary" style="margin-top:14px">Sign In</button>

    <div id="login-error" style="color:#ff8080;margin-top:10px"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <h2 style="margin:10px 0">Lead List</h2>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Comment</th>
            <th>Date & Time</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="6" style="text-align:center" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Edit Lead</h3>
      <button id="modal-close" class="btn-ghost">Close</button>
    </div>

    <label class="muted">Name</label>
    <input id="m-name">

    <label class="muted">Email</label>
    <input id="m-email">

    <label class="muted">Phone</label>
    <input id="m-phone">

    <label class="muted">Comment</label>
    <textarea id="m-comment" rows="4"></textarea>

    <div style="margin-top:14px;display:flex;gap:8px">
      <button id="modal-save" class="btn-primary">Save</button>
      <button id="modal-delete" class="btn-ghost" style="background:#3b1b1b;color:white">Delete</button>
    </div>
  </div>
</div>

<script type="module">
/* ---------------------------------------------------------
   Firebase imports
--------------------------------------------------------- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, onSnapshot,
  doc, getDoc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ---------------------------------------------------------
   Firebase config (YOUR PROJECT)
--------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDPqbxxoNUos9Zqe-En4qQghHPLjCUN3vA",
  authDomain: "finaqular-crm.firebaseapp.com",
  projectId: "finaqular-crm",
  storageBucket: "finaqular-crm.firebasestorage.app",
  messagingSenderId: "708297871714",
  appId: "1:708297871714:web:bff1ff1976f33bb1b55c3b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------------------------------------------------------
   STAFF LOGIN SYSTEM
--------------------------------------------------------- */
const STAFF_USER = "admin@finaqular.com";
const STAFF_PASS = "admin@123";

const loginScreen = document.getElementById("login-screen");
const dashboard = document.getElementById("dashboard");
const logoutBtn = document.getElementById("logout-btn");

document.getElementById("login-btn").onclick = () => {
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value.trim();

  if (email === STAFF_USER && pass === STAFF_PASS) {
    loginScreen.style.display = "none";
    dashboard.style.display = "block";
    logoutBtn.style.display = "inline-block";
    startRealtime();
  } else {
    document.getElementById("login-error").textContent = "Incorrect username or password.";
  }
};

logoutBtn.onclick = () => location.reload();

/* ---------------------------------------------------------
   REALTIME TABLE LOADING
--------------------------------------------------------- */
const tbody = document.getElementById("table-body");
let allLeads = [];

function startRealtime() {
  const q = query(collection(db, "leads"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    const rows = [];
    snapshot.forEach((docSnap) => {
      rows.push({ id: docSnap.id, ...docSnap.data() });
    });

    allLeads = rows;
    renderTable(rows);
  });
}

function renderTable(leads) {
  if (!leads.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="muted" style="text-align:center">No leads yet.</td></tr>`;
    return;
  }

  tbody.innerHTML = leads.map((l) => {
    const created = formatDate(l.createdAt);
    return `
      <tr>
        <td>${escape(l.name || "-")}</td>
        <td>${escape(l.email || "-")}</td>
        <td>${escape(l.phone || "-")}</td>
        <td>${escape(l.comment || "-")}</td>
        <td>${created}</td>
        <td><button class="action-btn" onclick="openModal('${l.id}')">Edit</button></td>
      </tr>
    `;
  }).join("");
}

/* ---------------------------------------------------------
   MODAL LOGIC
--------------------------------------------------------- */
window.openModal = async (id) => {
  currentId = id;
  modal.style.display = "flex";

  const snap = await getDoc(doc(db, "leads", id));
  if (!snap.exists()) return;

  const d = snap.data();
  mName.value = d.name || "";
  mEmail.value = d.email || "";
  mPhone.value = d.phone || "";
  mComment.value = d.comment || "";
};

modal-close.onclick = () => { modal.style.display = "none"; };

modal-save.onclick = async () => {
  if (!currentId) return;

  await updateDoc(doc(db, "leads", currentId), {
    name: mName.value.trim(),
    email: mEmail.value.trim(),
    phone: mPhone.value.trim(),
    comment: mComment.value.trim()
  });

  modal.style.display = "none";
};

modal-delete.onclick = async () => {
  if (!currentId) return;
  if (!confirm("Delete this lead?")) return;

  await deleteDoc(doc(db, "leads", currentId));
  modal.style.display = "none";
};

function escape(v){ return String(v).replace(/[<>&]/g, s=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[s])); }
function formatDate(ts){
  if (!ts) return "-";
  return ts.seconds ? new Date(ts.seconds * 1000).toLocaleString() : "-";
}

</script>

</body>
</html>
